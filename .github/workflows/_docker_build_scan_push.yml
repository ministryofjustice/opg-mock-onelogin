name: "[Workflow] Pull Request"

on:
  workflow_call:
    inputs:
        build_latest:
            description: 'Branch name'
            type: boolean
            default: false
        semver_tag:
            description: 'Semver tag'
            required: true
            type: string

permissions:
  id-token: write
  contents: write
  security-events: write
  pull-requests: write
  actions: none
  checks: none
  deployments: none
  issues: write
  packages: none
  repository-projects: none
  statuses: none

defaults:
  run:
    shell: bash

jobs:
  build_scan_push:
    name: "Docker build, Snyk scan, ECR push"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        data:
          - docker_build_directory: .
            image_app_name: mock-onelogin
            ecr_repository: mock-onelogin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.22'
          cache-dependency-path: "**/*.sum"

      - name: Run tests
        run: |
          go test -v ./...

      - name: Configure OIDC AWS credentials for ECR push and pull
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OIDC_ECR_ROLE }}
          role-session-name: opg-mock-onelogin-github-actions-ecr-push-pull
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: ECR Login
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: 311462405659

      - name: Generate tags for Docker
        env:
          SEMVER_TAG: ${{ inputs.semver_tag }}
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.data.ecr_repository }}
        id: docker_tags
        run: |
          if ${{ inputs.build_latest }}; then
            echo "tags=$ECR_REGISTRY/$ECR_REPOSITORY:latest,$ECR_REGISTRY/$ECR_REPOSITORY:$SEMVER_TAG,$ECR_REGISTRY/$ECR_REPOSITORY:main-$SEMVER_TAG" >> $GITHUB_OUTPUT
          else
            echo "tags=$ECR_REGISTRY/$ECR_REPOSITORY:$SEMVER_TAG" >> $GITHUB_OUTPUT
          fi
          echo "semver_tag=$ECR_REGISTRY/$ECR_REPOSITORY:$SEMVER_TAG" >> $GITHUB_OUTPUT
          echo "local_snyk_test_tag=$ECR_REPOSITORY:$SEMVER_TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.data.docker_build_directory }}/Dockerfile
          load: true
          tags: ${{ steps.docker_tags.outputs.local_snyk_test_tag }}

      - name: Debug built image
        run: |
          docker image ls
          docker image inspect "${{ steps.docker_tags.outputs.local_snyk_test_tag }}"

      - name: Snyk Scan
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@e8b6e80d440613671b8d6f87b5e52a5363cc974a # v5.0.0
        with:
          SNYK_TEST_IMAGE: ${{ steps.docker_tags.outputs.local_snyk_test_tag }}
          SNYK_TOKEN: ${{ secrets.SNYK_OPG_ORG_TOKEN }}
          snyk_test_args: --severity-threshold=high
          snyk_image_tag: main-cli-1.1308.3-v0.3.2

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: test-results/snyk.sarif
          category: snyk-docker

      - name: Push to ECR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.data.docker_build_directory }}/Dockerfile
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
