services:
  mock-onelogin:
    build:
      dockerfile: Dockerfile
    ports:
      - "6060:8080"
    environment:
      TEMPLATE_HEADER: "1"
      TEMPLATE_SUB: "1"
      PUBLIC_URL: "http://localhost:6060"
      TEMPLATE_RETURN_CODES: "1"
      REDIRECT_URL: "http://localhost:5050/auth/redirect,https://example-service/auth/redirect"
